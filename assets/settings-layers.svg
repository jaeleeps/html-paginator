<svg viewBox="0 0 820 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lay-title lay-desc">
  <title id="lay-title">How page settings combine</title>
  <desc id="lay-desc">Page settings are layered, later layers winning: the top-level page, the section's page settings (with those of the previous sections when linked to previous), odd or even page settings, the first page, the section's first page, and per-page overrides. A section linked to the previous one keeps its header; an unlinked section without a header falls back to the top-level one.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .mono { font-family: ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, monospace; }
      .layer { fill: #ffffff; stroke: rgba(45,49,66,0.35); stroke-width: 0.8; }
      .name { fill: #2d3142; font-size: 10px; font-weight: 600; }
      .code { fill: #eb6c36; font-size: 9px; }
      .note { fill: #4f5d75; font-size: 9px; }
      .cap { fill: #7a8399; font-size: 7px; letter-spacing: 0.08em; }
      .line { fill: rgba(45,49,66,0.16); }
    </style>
    <marker id="l-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="l-arr-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text x="40" y="30" fill="#2d3142" font-size="14" font-weight="600">How page settings combine</text>
  <text x="40" y="47" class="note">Each layer replaces only the properties it sets; null removes a header or footer.</text>

  <!-- later wins arrow -->
  <line x1="52" y1="330" x2="52" y2="78" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#l-arr)"/>
  <text x="44" y="210" class="cap mono" transform="rotate(-90 44 210)" text-anchor="middle">LATER WINS</text>

  <!-- layers, bottom (first) to top (last) -->
  <g transform="translate(66,0)">
    <rect class="layer" x="0" y="296" width="300" height="30" rx="3"/>
    <text x="12" y="315" class="name">Top-level page</text><text x="288" y="315" class="code mono" text-anchor="end">page</text>

    <rect x="0" y="260" width="300" height="30" rx="3" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="0.8"/>
    <text x="12" y="279" class="name">Section page settings</text><text x="288" y="279" class="code mono" text-anchor="end">sections[s].page</text>
    <text x="12" y="252" class="note" font-size="8">↳ linked: the previous sections' settings go under it</text>

    <rect class="layer" x="0" y="208" width="300" height="30" rx="3"/>
    <text x="12" y="227" class="name">Odd / even pages</text><text x="288" y="227" class="code mono" text-anchor="end">oddPages · evenPages</text>

    <rect x="0" y="172" width="300" height="30" rx="3" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="0.8"/>
    <text x="12" y="191" class="name">Section odd / even</text><text x="288" y="191" class="code mono" text-anchor="end">sections[s].oddPages …</text>

    <rect class="layer" x="0" y="136" width="300" height="30" rx="3"/>
    <text x="12" y="155" class="name">First page</text><text x="288" y="155" class="code mono" text-anchor="end">firstPage</text>

    <rect class="layer" x="0" y="100" width="300" height="30" rx="3"/>
    <text x="12" y="119" class="name">Section's first page</text><text x="288" y="119" class="code mono" text-anchor="end">sections[s].firstPage</text>

    <rect class="layer" x="0" y="64" width="300" height="30" rx="3" fill="rgba(45,49,66,0.06)"/>
    <text x="12" y="83" class="name">One page</text><text x="288" y="83" class="code mono" text-anchor="end">pageOverrides[n]</text>
  </g>

  <!-- link to previous example -->
  <text x="420" y="78" class="name">Link to Previous</text>
  <text x="420" y="92" class="note">A section without its own header…</text>

  <g transform="translate(420,112)">
    <!-- A -->
    <text x="0" y="0" class="cap mono">SECTION A</text>
    <text x="0" y="12" class="code mono" font-size="8">header: 'Part One'</text>
    <rect x="0" y="22" width="100" height="136" fill="#ffffff" stroke="#bfc0c0"/>
    <rect x="8" y="30" width="84" height="14" rx="2" fill="rgba(45,49,66,0.08)"/>
    <text x="50" y="40" fill="#2d3142" font-size="8" text-anchor="middle">Part One</text>
    <g class="line"><rect x="8" y="54" width="84" height="4"/><rect x="8" y="63" width="84" height="4"/><rect x="8" y="72" width="60" height="4"/><rect x="8" y="85" width="84" height="4"/><rect x="8" y="94" width="84" height="4"/></g>

    <!-- B linked -->
    <text x="128" y="0" class="cap mono">SECTION B</text>
    <text x="128" y="12" class="code mono" font-size="8">linkToPrevious: true</text>
    <rect x="128" y="22" width="100" height="136" fill="#ffffff" stroke="#eb6c36"/>
    <rect x="136" y="30" width="84" height="14" rx="2" fill="rgba(235,108,54,0.12)"/>
    <text x="178" y="40" fill="#2d3142" font-size="8" text-anchor="middle">Part One</text>
    <g class="line"><rect x="136" y="54" width="84" height="4"/><rect x="136" y="63" width="84" height="4"/><rect x="136" y="72" width="84" height="4"/><rect x="136" y="81" width="40" height="4"/></g>
    <path d="M 92,37 Q 114,20 134,35" stroke="#eb6c36" stroke-width="1.2" fill="none" marker-end="url(#l-arr-a)"/>
    <text x="178" y="176" class="note" text-anchor="middle">…keeps the one before it</text>

    <!-- C not linked -->
    <text x="256" y="0" class="cap mono">SECTION C</text>
    <text x="256" y="12" class="code mono" font-size="8">{ }</text>
    <rect x="256" y="22" width="100" height="136" fill="#ffffff" stroke="#bfc0c0"/>
    <rect x="264" y="30" width="84" height="14" rx="2" fill="rgba(45,49,66,0.08)"/>
    <text x="306" y="40" fill="#7a8399" font-size="8" text-anchor="middle">top-level header</text>
    <g class="line"><rect x="264" y="54" width="84" height="4"/><rect x="264" y="63" width="84" height="4"/><rect x="264" y="72" width="70" height="4"/></g>
    <text x="306" y="176" class="note" text-anchor="middle">…or falls back to page</text>
  </g>
</svg>
