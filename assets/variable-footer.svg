<svg viewBox="0 0 880 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="footer-title footer-desc">
  <title id="footer-title">Variable footer with pageOverrides</title>
  <desc id="footer-desc">Diagram showing how page 1 gets a cover footer via data-hp-page override while pages 2 and 3 use the shared default footer from data-hp-footer.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .mono { font-family: ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, monospace; }
    </style>
    <marker id="f-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="f-arr-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- ============================================================ -->
  <!-- CONFIG TEMPLATE (left side)                                  -->
  <!-- ============================================================ -->

  <rect x="24" y="20" width="108" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="78" y="31" fill="rgba(45,49,66,0.8)" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.08em">CONFIGURATION</text>

  <!-- Config container -->
  <rect x="24" y="48" width="240" height="340" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
  <text x="36" y="68" fill="#7a8399" font-size="7" class="mono" letter-spacing="0.06em">data-hp-config</text>

  <!-- Shared footer (default) -->
  <rect x="36" y="80" width="216" height="100" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="44" y="88" width="72" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="80" y="97" fill="rgba(45,49,66,0.8)" font-size="6" class="mono" text-anchor="middle" letter-spacing="0.06em">DEFAULT FOOTER</text>
  <text x="44" y="116" fill="#2d3142" font-size="8" font-weight="600" class="mono">data-hp-footer</text>
  <line x1="44" y1="124" x2="244" y2="124" stroke="rgba(45,49,66,0.10)" stroke-width="0.5"/>
  <text x="44" y="140" fill="#4f5d75" font-size="8">Standard disclaimer text.</text>
  <text x="44" y="156" fill="#4f5d75" font-size="8">Auto-generated, unaudited</text>
  <text x="44" y="172" fill="#4f5d75" font-size="8">performance numbers...</text>

  <!-- Page 1 override -->
  <rect x="36" y="196" width="216" height="180" rx="4" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1"/>
  <rect x="44" y="204" width="88" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
  <text x="88" y="213" fill="rgba(235,108,54,0.8)" font-size="6" class="mono" text-anchor="middle" letter-spacing="0.06em">PAGE 1 OVERRIDE</text>
  <text x="44" y="232" fill="#eb6c36" font-size="8" font-weight="600" class="mono">data-hp-page="1"</text>
  <line x1="44" y1="240" x2="244" y2="240" stroke="rgba(235,108,54,0.10)" stroke-width="0.5"/>
  <text x="48" y="256" fill="#2d3142" font-size="8" font-weight="600" class="mono">data-hp-footer</text>
  <text x="48" y="276" fill="#4f5d75" font-size="8">¹ Net of 0.35% fee. All tax</text>
  <text x="48" y="292" fill="#4f5d75" font-size="8">estimates assume highest</text>
  <text x="48" y="308" fill="#4f5d75" font-size="8">bracket with 40.8% income</text>
  <text x="48" y="324" fill="#4f5d75" font-size="8">tax rate, 23.8% LTCG rate...</text>
  <text x="48" y="344" fill="#4f5d75" font-size="8">² Dividends reinvested.</text>
  <text x="48" y="364" fill="#7a8399" font-size="7" class="mono">(longer, with footnotes ¹ ²)</text>

  <!-- ============================================================ -->
  <!-- ARROWS from config to pages                                  -->
  <!-- ============================================================ -->

  <!-- Page 1 override → Page 1 (coral) -->
  <path d="M 252,284 L 356,284 Q 364,284 364,276 L 364,76" stroke="#eb6c36" stroke-width="1.2" fill="none" marker-end="url(#f-arr-a)"/>
  <rect x="280" y="270" width="52" height="12" rx="2" fill="#f5f5f5"/>
  <text x="306" y="279" fill="#eb6c36" font-size="7" class="mono" text-anchor="middle">PAGE 1</text>

  <!-- Shared footer → Pages 2-3 -->
  <path d="M 252,132 L 320,132 Q 328,132 328,140 L 328,244 Q 328,252 336,252 L 356,252" stroke="#4f5d75" stroke-width="1.2" fill="none"/>
  <path d="M 328,252 L 328,412 Q 328,420 336,420" stroke="#4f5d75" stroke-width="1.2" fill="none"/>
  <!-- arrowheads at page 2 and 3 tops -->
  <line x1="336" y1="252" x2="356" y2="252" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#f-arr)"/>
  <line x1="336" y1="420" x2="356" y2="420" stroke="#4f5d75" stroke-width="1.2"/>

  <rect x="292" y="156" width="64" height="12" rx="2" fill="#f5f5f5"/>
  <text x="324" y="165" fill="#4f5d75" font-size="7" class="mono" text-anchor="middle">PAGES 2+</text>

  <!-- ============================================================ -->
  <!-- PAGE 1 (coral-highlighted footer)                            -->
  <!-- ============================================================ -->

  <rect x="368" y="24" width="148" height="220" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
  <text x="442" y="18" fill="#7a8399" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.08em">PAGE 1</text>
  <!-- header -->
  <rect x="376" y="32" width="132" height="28" rx="2" fill="rgba(45,49,66,0.04)" stroke="rgba(45,49,66,0.12)" stroke-width="0.5"/>
  <text x="442" y="44" fill="#2d3142" font-size="8" font-weight="600" text-anchor="middle">Performance Report</text>
  <text x="442" y="56" fill="#7a8399" font-size="7" text-anchor="middle">Account: XXXX-1234</text>
  <!-- body -->
  <rect x="376" y="68" width="132" height="104" rx="2" fill="rgba(45,49,66,0.02)"/>
  <text x="442" y="124" fill="#bfc0c0" font-size="9" text-anchor="middle">...content...</text>
  <!-- footer (coral = page 1 override) -->
  <line x1="376" y1="180" x2="508" y2="180" stroke="#eb6c36" stroke-width="0.8"/>
  <rect x="376" y="184" width="132" height="52" rx="0" fill="rgba(235,108,54,0.04)"/>
  <text x="384" y="196" fill="#4f5d75" font-size="6">¹ Net of 0.35% fee...</text>
  <text x="384" y="208" fill="#4f5d75" font-size="6">tax rates: 40.8% / 23.8%</text>
  <text x="384" y="220" fill="#4f5d75" font-size="6">² Dividends reinvested.</text>
  <text x="384" y="232" fill="#4f5d75" font-size="6">Not an offer to sell...</text>

  <!-- ============================================================ -->
  <!-- PAGE 2 (default footer)                                      -->
  <!-- ============================================================ -->

  <rect x="368" y="264" width="148" height="180" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
  <text x="442" y="258" fill="#7a8399" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.08em">PAGE 2</text>
  <!-- body -->
  <rect x="376" y="272" width="132" height="108" rx="2" fill="rgba(45,49,66,0.02)"/>
  <text x="442" y="328" fill="#bfc0c0" font-size="9" text-anchor="middle">...content...</text>
  <!-- footer (default) -->
  <line x1="376" y1="388" x2="508" y2="388" stroke="#bfc0c0" stroke-width="0.8"/>
  <rect x="376" y="392" width="132" height="44" rx="0" fill="rgba(45,49,66,0.02)"/>
  <text x="384" y="404" fill="#4f5d75" font-size="6">Not an offer to sell...</text>
  <text x="384" y="416" fill="#4f5d75" font-size="6">past performance is not</text>
  <text x="384" y="428" fill="#4f5d75" font-size="6">indicative of future results.</text>

  <!-- ============================================================ -->
  <!-- PAGE 3 (default footer, same)                                -->
  <!-- ============================================================ -->

  <rect x="536" y="264" width="148" height="180" rx="4" fill="#ffffff" stroke="#bfc0c0" stroke-width="1"/>
  <text x="610" y="258" fill="#7a8399" font-size="7" class="mono" text-anchor="middle" letter-spacing="0.08em">PAGE 3</text>
  <!-- body -->
  <rect x="544" y="272" width="132" height="108" rx="2" fill="rgba(45,49,66,0.02)"/>
  <text x="610" y="328" fill="#bfc0c0" font-size="9" text-anchor="middle">...content...</text>
  <!-- footer (default) -->
  <line x1="544" y1="388" x2="676" y2="388" stroke="#bfc0c0" stroke-width="0.8"/>
  <rect x="544" y="392" width="132" height="44" rx="0" fill="rgba(45,49,66,0.02)"/>
  <text x="552" y="404" fill="#4f5d75" font-size="6">Not an offer to sell...</text>
  <text x="552" y="416" fill="#4f5d75" font-size="6">past performance is not</text>
  <text x="552" y="428" fill="#4f5d75" font-size="6">indicative of future results.</text>

  <!-- "same" bracket between page 2 and 3 footers -->
  <path d="M 512,408 L 532,408" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" fill="none"/>
  <text x="522" y="400" fill="#7a8399" font-size="7" class="mono" text-anchor="middle">same</text>

  <!-- Arrow from shared footer to page 3 -->
  <path d="M 328,420 L 540,420" stroke="#4f5d75" stroke-width="1.2" fill="none" marker-end="url(#f-arr)"/>
</svg>
