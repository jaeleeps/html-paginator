<!doctype html>
<!--
  Vertical alignment (Word: Page Setup > Vertical alignment). A cover section
  centered on its page, body pages at the top, and a colophon section aligned
  to the bottom, above its footnote. Margins between the cover's elements
  collapse as they do at the top. Page borders (Word: Page Borders): none on
  the cover, 24pt from the edge on body pages, 4pt from the text on the
  colophon.
-->
<html>
<head>
<meta charset="utf-8">
<title>html-paginator vertical alignment fixture</title>
<style>
  body { margin: 0; font: 12px/18px Helvetica, Arial, sans-serif; }
  p { margin: 0 0 6px; }
  h1 { margin: 0 0 24px; font-size: 32px; line-height: 40px; text-align: center; }
  .subtitle { margin-top: 12px; text-align: center; }
</style>
</head>
<body>
<div id="src">
  <section data-section="cover">
    <h1>COVER TITLE</h1>
    <p class="subtitle">A subtitle under the title</p>
  </section>
  <section data-section="main" id="main"></section>
  <section data-section="colophon">
    <p>COLOPHON set in Helvetica.<span data-footnote>A note under the colophon.</span></p>
    <p>Printed on demand.</p>
  </section>
</div>
<script src="/dist/index.global.js"></script>
<script>
  const lorem = 'Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.';
  document.getElementById('main').innerHTML = Array.from({ length: 40 }, (_, i) => `<p>M${i + 1} ${lorem} ${lorem}</p>`).join('');
  htmlPaginator.createPaginator({
    source: '#src',
    page: {
      size: 'letter',
      margin: '1in',
      footer: ({ pageLabel }) => `<div style="text-align:center">${pageLabel}</div>`,
      pageBorder: '2px solid #000',
    },
    sections: {
      cover: { page: { verticalAlign: 'center', pageBorder: null } },
      main: {},
      colophon: { page: { verticalAlign: 'bottom', pageBorder: { border: '3px double #000', from: 'text' } } },
    },
  }).paginate();
  document.documentElement.dataset.paginated = 'true';
</script>
</body>
</html>
