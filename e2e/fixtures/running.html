<!doctype html>
<!--
  Running headers (Word's STYLEREF): each header shows the chapter (the
  first h1 on the page, else the last before it) and, dictionary-style, the
  first and last term on the page (data-hp-running="term").
-->
<html>
<head>
<meta charset="utf-8">
<title>html-paginator running headers fixture</title>
<style>
  body { margin: 0; font: 12px/18px Helvetica, Arial, sans-serif; }
  h1 { font-size: 20px; line-height: 26px; margin: 0 0 10px; }
  dt { font-weight: bold; }
  dd { margin: 0 0 8px 1.5em; }
  .hp-header { border-bottom: 1px solid #999; padding-bottom: 4px; margin-bottom: 12px; }
</style>
</head>
<body>
<div id="src"></div>
<script src="/dist/index.global.js"></script>
<script>
  const lorem = 'Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.';
  let html = '';
  for (const [c, name] of [['A', 'Alpha'], ['B', 'Beta'], ['C', 'Gamma and a much longer chapter title']]) {
    html += `<h1>CHAPTER ${name}</h1><dl>`;
    for (let i = 1; i <= 45; i++) {
      html += `<dt data-hp-running="term">${c}term${String(i).padStart(2, '0')}</dt><dd>${lorem.repeat(1 + (i % 3))}</dd>`;
    }
    html += '</dl>';
  }
  document.getElementById('src').innerHTML = html;
  htmlPaginator.createPaginator({
    source: '#src',
    page: {
      size: 'letter',
      margin: '0.75in',
      header: ({ running, runningLast }) =>
        `<div><span class="chapter">${running.h1 ?? ''}</span> — <span class="first">${running.term ?? ''}</span> – <span class="last">${runningLast.term ?? ''}</span></div>`,
      footer: ({ pageLabel }) => `<div style="text-align:center">${pageLabel}</div>`,
    },
  }).paginate();
  document.documentElement.dataset.paginated = 'true';
</script>
</body>
</html>
